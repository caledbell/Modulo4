
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Consulta de contactos</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="buscar" class="form-label">Buscar</label>
                    <input type="text" id="buscar"
                           class="form-control"
                           placeholder="Buscar contacto...">
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover"
                           id="tablaContactos">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Identificación</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Ana López</td>
                                <td>101230456</td>
                                <td>8888-8888</td>
                                <td>ana@correo.com</td>
                                <td><span class="badge bg-success">Activo</span></td>
                                <td>
                                    <button class="btn btn-warning btn-sm">Editar</button>
                                    <button class="btn btn-danger btn-sm">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Carlos Méndez</td>
                                <td>202340567</td>
                                <td>8777-7777</td>
                                <td>carlos@correo.com</td>
                                <td><span class="badge bg-success">Activo</span></td>
                                <td>
                                    <button class="btn btn-warning btn-sm">Editar</button>
                                    <button class="btn btn-danger btn-sm">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>María Rodríguez</td>
                                <td>303450678</td>
                                <td>8666-6666</td>
                                <td>maria@correo.com</td>
                                <td><span class="badge bg-secondary">Inactivo</span></td>
                                <td>
                                    <button class="btn btn-warning btn-sm">Editar</button>
                                    <button class="btn btn-danger btn-sm">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById("buscar").addEventListener("input", function () {
            const filtro = this.value.toLowerCase();
            const filas = document.querySelectorAll("#tablaContactos tbody tr");
            filas.forEach(function (fila) {
                fila.style.display = fila.textContent.toLowerCase().includes(filtro)
                    ? ""
                    : "none";
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
